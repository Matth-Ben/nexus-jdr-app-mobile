<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Nexus JDR — Personnages">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3C26"/>
      <stop offset="1" stop-color="#241609"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6B73A"/>
      <stop offset="1" stop-color="#C9962C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.65">
      <stop offset="0" stop-color="#8A5A34" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8A5A34" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond bois, coins arrondis façon icône d'app -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#C9962C" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Blason -->
  <path d="M 196 158
           C 196 146 206 138 218 138
           L 294 138
           C 306 138 316 146 316 158
           L 316 268
           C 316 322 282 364 256 384
           C 230 364 196 322 196 268
           Z"
        fill="url(#gold)" stroke="#3E2415" stroke-width="6" stroke-linejoin="round"/>

  <!-- Empreinte intérieure du blason, ton bois -->
  <path d="M 210 166
           C 210 160 214 156 220 156
           L 292 156
           C 298 156 302 160 302 166
           L 302 266
           C 302 310 274 346 256 364
           C 238 346 210 310 210 266
           Z"
        fill="#3E2415"/>

  <!-- Dé à 20 faces (d20) stylisé, symbole du jeu de rôle -->
  <g stroke="#E6B73A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M 256 182 L 314 214 L 314 268 L 256 300 L 198 268 L 198 214 Z" fill="#4A2E1A"/>
    <path d="M 256 182 L 256 300 M 198 214 L 314 268 M 314 214 L 198 268"/>
  </g>
  <text x="256" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#F3E6C8">20</text>

  <!-- Clous du blason, écho des coins cloutés du design system -->
  <circle cx="222" cy="164" r="5" fill="#3E2415"/>
  <circle cx="290" cy="164" r="5" fill="#3E2415"/>
</svg>
