name: personnages
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+7

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  # sqlite3_flutter_libs est gelé en 0.6.0+eol par son mainteneur (plus de
  # nouvelles versions) au profit de sqlite3 3.x, qui bundle SQLite via les
  # build hooks/native assets Flutter (stable depuis Flutter 3.38 / Dart 3.10,
  # cf. config/README.md pour le contexte) — plus besoin de ce package.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  # Utilisé par `lib/core/cache/app_database.dart` pour construire le chemin
  # du fichier SQLite du cache — déjà résolu transitivement (path_provider,
  # drift...) mais déclaré explicitement puisqu'importé directement par du
  # code de ce dépôt (pas seulement par les tests).
  path: ^1.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  xml: ^7.0.1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.0
  # Sélecteur de fichier natif pour l'import XML aidedd.org
  # (`lib/features/xml_import/`) — `image_picker` ne gère que les images.
  file_picker: ^12.1.3
  # File de synchro hors-ligne PV/XP (`core/network/connectivity_checker.dart`,
  # `core/cache/pending_character_write_queue.dart`) — voir
  # `docs/cahier-des-charges/01-architecture-technique.md`, section "Mode
  # hors-ligne".
  connectivity_plus: ^6.1.5
  # Lit dynamiquement le numéro de version affiché en pied de page de l'écran
  # "Profil" (`features/profile/presentation/profile_screen.dart`) — jamais
  # une version codée en dur, qui se désynchroniserait de `pubspec.yaml`
  # (`version:` en tête de ce fichier) à chaque publication.
  package_info_plus: ^10.2.1
  # Propose au partage/enregistrement le fichier JSON généré par "Export de
  # mes données" (`features/profile/presentation/widgets/export_data_sheet.dart`)
  # — voir `docs/cahier-des-charges/11-fonctionnalites-a-ajouter.md`, écran
  # Profil / Confidentialité et données.
  share_plus: ^13.3.0
  # Ouvre les réglages système de l'app pour "Gestion des autorisations
  # appareil" (`features/profile/presentation/widgets/device_permissions_sheet.dart`)
  # — texte statique, aucune lecture d'état de permission (décision chef de
  # projet), donc `app_settings` plutôt que le plus lourd
  # `permission_handler`.
  app_settings: ^9.0.0
  # Ouvre le client e-mail natif (URI `mailto:`) pour "Contacter le support"
  # de l'écran "Aide et support"
  # (`features/profile/presentation/profile_help_screen.dart`) — voir aussi
  # le bloc `<queries>` ajouté à `android/app/src/main/AndroidManifest.xml`
  # (Android 11+/API 30+ masque `canLaunchUrl` sans cette déclaration).
  url_launcher: ^6.3.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Analytics produit (`lib/core/analytics/`), avec PostHog ci-dessous —
  # bascule utilisateur "Partager mes données d'usage" dans l'écran
  # "Confidentialité" (`features/profile/presentation/profile_privacy_screen.dart`).
  # Android uniquement pour l'instant, même garde que `firebase_messaging`
  # (`firebase_options.dart` ne couvre pas encore iOS).
  firebase_analytics: ^12.6.0
  # Remontée de plantage (dette D13, `docs/dette-technique.md`) — réutilise
  # le même projet Firebase que `firebase_messaging`/`firebase_analytics`
  # ci-dessus (`firebase_options.dart`), même garde Android uniquement pour
  # l'instant (voir `main.dart::_initializeSupabaseAndFirebase`). Collecte
  # désactivée en debug (`AppBootstrap`/`main.dart`), même principe que
  # `AnalyticsPreferencesController` pour les deux SDK d'analytics ci-dessus.
  firebase_crashlytics: ^5.4.0
  # Analytics produit, second SDK indépendant de Firebase (voir
  # `lib/core/analytics/`) — s'initialise sur toutes les plateformes cibles
  # dès que sa config (`POSTHOG_API_KEY`) est renseignée, contrairement à
  # `firebase_analytics` ci-dessus.
  posthog_flutter: ^5.46.0
  # Persiste la fermeture de la bannière "Mise à jour suggérée"
  # (`features/app_update/presentation/widgets/update_suggested_banner.dart`)
  # par version, pour qu'elle ne réapparaisse pas en boucle à chaque
  # affichage tant qu'aucune nouvelle version n'est sortie — déjà résolu
  # transitivement (`supabase_flutter`/`gotrue` s'en servent pour le stockage
  # de session sur certaines plateformes), mais déclaré explicitement
  # puisqu'importé directement par du code de ce dépôt (même rationale que
  # `path` plus haut).
  shared_preferences: ^2.5.5
  # Dictée vocale du bouton micro de l'onglet "Notes" de l'écran "Groupe"
  # (`features/groups/presentation/widgets/group_notes_tab_body.dart`) —
  # passe par le moteur de reconnaissance vocale du système (Android
  # SpeechRecognizer / iOS Speech framework), jamais par nos propres
  # serveurs ; selon l'appareil, ce moteur système peut lui-même transiter
  # par un service distant du fabricant (Google/Apple), hors de notre
  # contrôle.
  speech_to_text: ^7.5.0
  # `TimeoutHttpClient` (`core/network/timeout_http_client.dart`, dette D12) —
  # délai global de 15s injecté dans `Supabase.initialize(httpClient: ...)`.
  # Déjà résolu transitivement par `supabase`/`postgrest`/`gotrue`, déplacé
  # ici depuis `dev_dependencies` (où il ne servait jusqu'ici qu'à
  # `package:http/testing.dart` dans les tests) puisqu'il est désormais
  # importé directement par du code de `lib/`.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  # Génère les ressources natives Android/iOS du splash screen à partir des
  # PNG de `assets/splash/` (voir section `flutter_native_splash:` plus bas)
  # — dev dependency uniquement : lancé par `tool/generate_splash_assets.sh`,
  # ce package n'est pas utilisé au runtime de l'app.
  flutter_native_splash: ^2.4.8
  # Génère les icônes natives Android/iOS (mipmaps + Assets.xcassets) à partir
  # de `docs/assets/IconAppStore@1x.png` (voir section `flutter_launcher_icons:`
  # plus bas) — même logo que le splash screen/l'écran de connexion
  # (`AppBrandBadge`, `core/widgets/app_brand_badge.dart`), déjà l'image
  # officielle App Store/Play Store du dépôt. Dev dependency uniquement, même
  # principe que `flutter_native_splash` ci-dessus : le rendu natif est
  # produit une fois via `dart run flutter_launcher_icons`, ce package n'est
  # pas utilisé au runtime de l'app.
  flutter_launcher_icons: ^0.14.4
  # `PathProviderPlatform.instance` — utilisé uniquement par
  # `test/features/profile/data/data_export_repository_test.dart` pour
  # fabriquer un répertoire temporaire de test sans jamais passer par le
  # vrai canal de plateforme de `path_provider` (indisponible dans `flutter
  # test`). Déjà résolu transitivement par `path_provider`, déclaré
  # explicitement puisqu'importé directement par du code de test de ce
  # dépôt.
  path_provider_platform_interface: ^2.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Configuration de `flutter_native_splash` (voir la dev dependency ci-dessus)
# — génère les fichiers natifs Android/iOS de l'écran de chargement à partir
# des PNG sources `assets/splash/*.png`.
#
# Ces PNG ne sont pas dessinés à la main : `tool/generate_splash_assets.sh`
# les rend à partir des vrais widgets de l'écran de lancement Flutter
# (`lib/features/splash/presentation/splash_screen.dart`), puis lance
# `dart run flutter_native_splash:create`. Un splash natif s'affiche avant le
# démarrage du moteur Flutter et ne peut contenir que des images : rendues
# depuis le code, elles reprennent à l'identique le dégradé et l'emblème du
# splash Flutter avant Android 12 et sur iOS (les joints de planches et le
# grain de `SceneScaffold` n'y figurent pas). Sur Android 12 et plus, le
# système centre l'icône à l'écran : saut vertical connu de l'emblème quand
# Flutter prend le relais. Après toute modification de cette section ou de
# ce que montre `SplashScreen`, relancer :
#   tool/generate_splash_assets.sh
#
# Le package traite chaque image source comme du xxxhdpi (4 px par dp) et en
# dérive les autres densités : une source ne doit donc jamais dépasser la
# taille affichée x 4 (des sources de 8000 x 6000 px pesaient 192 Mo une
# fois décodées, par image).
#
# - `background_image` (avant Android 12, et iOS) : 16 x 512 px, le dégradé
#   vertical `AppColors.sceneBackground`, étiré à l'écran par
#   `gravity="fill"`. `color` et `background_image` sont mutuellement
#   exclusifs pour ce package, et le fond réel est un dégradé.
# - `image` (avant Android 12, et iOS) : 640 x 876 px, soit 160 x 219 dp.
#   Emblème + "NEXUS JDR" + "PERSONNAGES" en haut d'une toile transparente
#   de la hauteur de la colonne complète de `SplashScreen` (hauteur mesurée
#   par le script) : centrée par `gravity="center"`, elle place ces trois
#   éléments là où Flutter les dessine. Ni les 3 points ni "Préparation de
#   la taverne…" : un indicateur de chargement figé n'a pas de sens.
# - `android_12.image` : 1152 x 1152 px, soit 288 x 288 dp, format imposé
#   par Android pour une icône sans fond (contenu visible dans un cercle de
#   192 dp de diamètre) ; l'emblème y fait 96 dp, comme dans `SplashScreen`.
# - `android_12.color` : Android 12 et plus n'accepte qu'une couleur unie en
#   fond. `AppColors.woodDark` est la teinte de la palette la plus proche du
#   milieu du dégradé, là où se trouve l'emblème.
# - Pas d'image de marque (`android_12.branding`) : décision du 07/10/2026.
flutter_native_splash:
  background_image: "assets/splash/splash_background.png"
  image: "assets/splash/splash_logo.png"

  android_12:
    color: "#3E2415"
    image: "assets/splash/splash_icon_android12.png"

# Configuration de `flutter_launcher_icons` (voir la dev dependency
# ci-dessus) — génère les icônes natives Android (mipmap-*/ic_launcher.png)
# et iOS (Assets.xcassets/AppIcon.appiconset) à partir de
# `docs/assets/IconAppStore@1x.png` (1024×1024, déjà l'icône officielle App
# Store/Play Store du dépôt — même emblème que `AppBrandBadge`
# (`core/widgets/app_brand_badge.dart`), réutilisé tel quel plutôt que
# régénéré).
#
# `remove_alpha_ios: true` : l'App Store exige une icône sans canal alpha ;
# le PNG source est en RGBA (fond bois opaque mais canal alpha présent).
#
# Pas de calque premier plan adaptatif Android dédié (aucun asset "badge
# seul, fond transparent" fidèle au design actuel disponible à ce jour) :
# `docs/assets/IconAppStore@1x.png` sert aussi de premier plan adaptatif,
# avec `adaptive_icon_background` en aplat de secours (`AppColors.woodDark`)
# pour les rares cas où le masque du lanceur déborderait du fond bois de
# l'image — écart mineur assumé plutôt que produire un nouvel asset non
# demandé par la tâche.
#
# Après toute modification de cette section, régénérer avec :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "docs/assets/IconAppStore@1x.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3E2415"
  adaptive_icon_foreground: "docs/assets/IconAppStore@1x.png"
