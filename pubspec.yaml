name: personnages
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  # sqlite3_flutter_libs est gelé en 0.6.0+eol par son mainteneur (plus de
  # nouvelles versions) au profit de sqlite3 3.x, qui bundle SQLite via les
  # build hooks/native assets Flutter (stable depuis Flutter 3.38 / Dart 3.10,
  # cf. config/README.md pour le contexte) — plus besoin de ce package.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  # Utilisé par `lib/core/cache/app_database.dart` pour construire le chemin
  # du fichier SQLite du cache — déjà résolu transitivement (path_provider,
  # drift...) mais déclaré explicitement puisqu'importé directement par du
  # code de ce dépôt (pas seulement par les tests).
  path: ^1.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  xml: ^7.0.1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.0
  # Sélecteur de fichier natif pour l'import XML aidedd.org
  # (`lib/features/xml_import/`) — `image_picker` ne gère que les images.
  file_picker: ^12.1.3
  # File de synchro hors-ligne PV/XP (`core/network/connectivity_checker.dart`,
  # `core/cache/pending_character_write_queue.dart`) — voir
  # `docs/cahier-des-charges/01-architecture-technique.md`, section "Mode
  # hors-ligne".
  connectivity_plus: ^6.1.5
  # Lit dynamiquement le numéro de version affiché en pied de page de l'écran
  # "Profil" (`features/profile/presentation/profile_screen.dart`) — jamais
  # une version codée en dur, qui se désynchroniserait de `pubspec.yaml`
  # (`version:` en tête de ce fichier) à chaque publication.
  package_info_plus: ^10.2.1
  # Propose au partage/enregistrement le fichier JSON généré par "Export de
  # mes données" (`features/profile/presentation/widgets/export_data_sheet.dart`)
  # — voir `docs/cahier-des-charges/11-fonctionnalites-a-ajouter.md`, écran
  # Profil / Confidentialité et données.
  share_plus: ^13.3.0
  # Ouvre les réglages système de l'app pour "Gestion des autorisations
  # appareil" (`features/profile/presentation/widgets/device_permissions_sheet.dart`)
  # — texte statique, aucune lecture d'état de permission (décision chef de
  # projet), donc `app_settings` plutôt que le plus lourd
  # `permission_handler`.
  app_settings: ^9.0.0
  # Ouvre le client e-mail natif (URI `mailto:`) pour "Contacter le support"
  # de l'écran "Aide et support"
  # (`features/profile/presentation/profile_help_screen.dart`) — voir aussi
  # le bloc `<queries>` ajouté à `android/app/src/main/AndroidManifest.xml`
  # (Android 11+/API 30+ masque `canLaunchUrl` sans cette déclaration).
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  # Génère les configurations natives Android/iOS du splash screen à partir
  # d'une image + d'une couleur de fond (voir section `flutter_native_splash:`
  # plus bas) — dev dependency uniquement : le rendu natif est produit une
  # fois via `dart run flutter_native_splash:create`, ce package n'est pas
  # utilisé au runtime de l'app.
  flutter_native_splash: ^2.4.8
  # `package:http/testing.dart` (`MockClient`) — utilisé uniquement par
  # `test/features/character_creation/data/character_creation_repository_test.dart`
  # pour fabriquer un `SupabaseClient` de test qui n'ouvre aucune vraie
  # connexion réseau (voir la doc de ce fichier de test pour le rationale :
  # aucun double factice de `SupabaseClient` lui-même n'existait déjà dans ce
  # dépôt avant cette tâche). Déjà résolu transitivement par
  # `supabase`/`postgrest`/`gotrue`, déclaré explicitement puisqu'importé
  # directement par du code de test de ce dépôt.
  http: ^1.6.0
  # `PathProviderPlatform.instance` — utilisé uniquement par
  # `test/features/profile/data/data_export_repository_test.dart` pour
  # fabriquer un répertoire temporaire de test sans jamais passer par le
  # vrai canal de plateforme de `path_provider` (indisponible dans `flutter
  # test`). Déjà résolu transitivement par `path_provider`, déclaré
  # explicitement puisqu'importé directement par du code de test de ce
  # dépôt.
  path_provider_platform_interface: ^2.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Configuration de `flutter_native_splash` (voir la dev dependency ci-dessus)
# — génère les fichiers natifs Android/iOS de l'écran de chargement à partir
# des PNG sources `assets/splash/*.png`. Ces PNG recyclent exactement
# l'habillage de `lib/features/auth/presentation/login_screen.dart` (icône
# `Icons.shield_rounded` + "NEXUS JDR" en `AppTypography.display`) : un splash
# natif s'affichant avant le démarrage du moteur Flutter, ni la police pixel
# ni l'icône Material ne sont dessinables nativement, donc ces PNG ont été
# produits une fois via un script temporaire (`RenderRepaintBoundary.
# toImage()` sur un widget hors-écran reproduisant exactement cette
# composition, avec `Press Start 2P` et `MaterialIcons` chargés manuellement
# via `FontLoader` — la police custom ne se charge pas dans le harnais de
# test, et les icônes Material n'y sont jamais rasterisées par défaut), lancé
# via `flutter test`, puis supprimé du dépôt (voir le rapport de la tâche
# "splash screen" pour son contenu exact si besoin de le régénérer/l'ajuster).
#
# Fond : `color`/`background_image` sont mutuellement exclusifs pour ce
# package (voir son README) — le fond réel de l'écran de connexion
# (`SceneScaffold`/`AppColors.sceneBackground`) est un dégradé, pas la
# couleur unie `AppColors.woodMedium`, donc on utilise `background_image`
# (le dégradé rasterisé) plutôt que `color` ici. Seule la section
# `android_12` (qui n'autorise qu'une couleur unie, jamais d'image de fond)
# retombe sur une couleur : `AppColors.woodMedium`, l'approximation unie la
# plus proche de ce dégradé bois dans la palette du design system.
#
# Après toute modification de cette section, régénérer avec :
#   dart run flutter_native_splash:create
flutter_native_splash:
  background_image: "assets/splash/splash_background.png"
  image: "assets/splash/splash_logo.png"

  android_12:
    color: "#6B4226"
    image: "assets/splash/splash_icon_android12.png"
    branding: "assets/splash/splash_branding_android12.png"
