org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Contournement d'un bug connu du compilateur Kotlin incremental sous Windows :
# le calcul de chemin relatif entre le cache pub (souvent sur C:) et le projet
# (sur un autre lecteur, ex. H:) plante ("this and base files have different
# roots"), avec le message "Daemon compilation failed" / échec de
# compileDebugKotlin pour les plugins Flutter (url_launcher_android,
# shared_preferences_android...). Désactiver l'incrémental évite le crash,
# au prix d'une compilation Kotlin légèrement plus lente.
kotlin.incremental=false
