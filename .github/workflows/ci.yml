name: CI

# Pipeline "CI" — docs/cahier-des-charges/13-depot-versioning-publication.md
# section 5 : lancée sur chaque pull request vers main, aucun accès aux
# secrets de signature. Vérifie lint, format, code généré à jour, tests, et
# compile un APK debug (flavor dev, config/dev.json.example — valeurs
# placeholder, un build debug n'a besoin que de compiler) pour attraper un
# bug de build spécifique à un flavor (ressources Android, configuration par
# flavor) qu'analyze/test ne détecteraient pas.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Vérifie que le code généré (freezed/riverpod/json_serializable) est à jour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' || {
            echo "::error::Du code généré n'est pas à jour avec sa source — lance 'dart run build_runner build --delete-conflicting-outputs' localement et commite le résultat."
            exit 1
          }

      - name: Vérifie que les traductions générées (flutter gen-l10n) sont à jour
        # `AppLocalizations` (`lib/l10n/app_localizations*.dart`) suit la même
        # convention que les fichiers `*.g.dart`/`*.freezed.dart` ci-dessus :
        # généré, mais committé (voir `lib/l10n/`, pas de règle `.gitignore`
        # dédiée) — chantier "traduction de l'app" Phase A
        # (`lib/l10n/app_fr.arb`/`app_en.arb`, `l10n.yaml`).
        run: |
          flutter gen-l10n
          git diff --exit-code -- 'lib/l10n/app_localizations*.dart' || {
            echo "::error::AppLocalizations n'est pas à jour avec lib/l10n/*.arb — lance 'flutter gen-l10n' localement et commite le résultat."
            exit 1
          }

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Build APK debug (flavor dev) — détecte les erreurs de build spécifiques à un flavor
        run: flutter build apk --flavor dev --debug --dart-define-from-file=config/dev.json.example -t lib/main.dart
