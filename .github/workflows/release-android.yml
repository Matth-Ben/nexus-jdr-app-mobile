name: Release Android

# Pipeline "Release" côté Android — docs/cahier-des-charges/13-depot-versioning-publication.md
# section 5. Déclenchée par un tag `v*` (créé sur le commit exactement
# soumis, voir section 3.2 du même document). Build un App Bundle signé
# avec le keystore de production et le joint à une Release GitHub.
#
# Ne publie PAS encore automatiquement sur le Play Store : ça nécessite un
# compte Google Play Console + un compte de service avec accès à l'API Play
# Developer, ni l'un ni l'autre n'existe à ce stade (voir
# docs/GOOGLE_PLAY_PUBLISHING.md pour la checklist complète et comment
# ajouter cette automatisation une fois prêt). Le fichier produit ici est à
# téléverser manuellement sur la Play Console pour l'instant.
#
# iOS non inclus : nécessite un compte Apple Developer Program (pas encore
# créé, voir README.md "État d'avancement") — à ajouter comme second job une
# fois ce prérequis réuni.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true

      - name: Restaure le keystore de production
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nexus-jdr-release.jks

      - name: Écrit android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=nexus-jdr
          storeFile=nexus-jdr-release.jks
          EOF

      - name: Écrit config/prod.json
        env:
          PROD_CONFIG_JSON: ${{ secrets.PROD_CONFIG_JSON }}
        run: echo "$PROD_CONFIG_JSON" > config/prod.json

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Vérifie que le build number a bien été incrémenté (pubspec.yaml)
        run: |
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+)$/\1/')
          echo "Build number de ce tag : $BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::Impossible de lire le build number depuis pubspec.yaml (format attendu: version: X.Y.Z+N)."
            exit 1
          fi

      - name: flutter build appbundle --flavor prod
        run: flutter build appbundle --flavor prod --dart-define-from-file=config/prod.json -t lib/main.dart

      - name: Publie une Release GitHub avec l'App Bundle signé
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          generate_release_notes: true
          body: |
            App Bundle Android signé (keystore de production), prêt à téléverser manuellement sur la Play Console.
            Publication automatique pas encore configurée — voir docs/GOOGLE_PLAY_PUBLISHING.md.
