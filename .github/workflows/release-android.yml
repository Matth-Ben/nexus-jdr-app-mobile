name: Release Android

# Pipeline "Release" côté Android — docs/cahier-des-charges/13-depot-versioning-publication.md
# section 5. Déclenchée par un tag `v*` (créé sur le commit exactement
# soumis, voir section 3.2 du même document). Build un App Bundle signé
# avec le keystore de production et le joint à une Release GitHub.
#
# Ne publie PAS encore automatiquement sur le Play Store : ça nécessite un
# compte Google Play Console + un compte de service avec accès à l'API Play
# Developer, ni l'un ni l'autre n'existe à ce stade (voir
# docs/GOOGLE_PLAY_PUBLISHING.md pour la checklist complète et comment
# ajouter cette automatisation une fois prêt). Le fichier produit ici est à
# téléverser manuellement sur la Play Console pour l'instant.
#
# iOS non inclus : nécessite un compte Apple Developer Program (pas encore
# créé, voir README.md "État d'avancement") — à ajouter comme second job une
# fois ce prérequis réuni.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Secrets stockés dans l'environnement GitHub "PROD" (Settings ->
    # Environments) plutôt qu'en secrets de dépôt classiques — ce job doit
    # déclarer explicitement l'environnement pour y avoir accès.
    environment: PROD
    # GITHUB_TOKEN est en lecture seule par défaut sur ce dépôt — nécessaire
    # pour que softprops/action-gh-release puisse créer la Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet (branches + tags) nécessaire pour retrouver le
          # tag v* précédent lors de la vérification du build number
          # ci-dessous — le fetch-depth par défaut (1) ne récupère que le
          # commit du tag courant.
          fetch-depth: 0

      - name: Récupère tous les tags (au cas où le checkout ci-dessus n'en ait pas ramené certains)
        run: git fetch --tags --force

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true

      - name: Restaure le keystore de production
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nexus-jdr-release.jks
          echo "Taille et empreinte du keystore décodé (à comparer avec le fichier local, aucune donnée sensible affichée) :"
          ls -l android/nexus-jdr-release.jks
          sha256sum android/nexus-jdr-release.jks

      - name: Écrit android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=nexus-jdr
          storeFile=nexus-jdr-release.jks
          EOF

      - name: Écrit config/prod.json
        env:
          PROD_CONFIG_JSON: ${{ secrets.PROD_CONFIG_JSON }}
        run: echo "$PROD_CONFIG_JSON" > config/prod.json

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      # Rejoue les mêmes vérifications que la pipeline "CI" avant de publier
      # un App Bundle signé en prod : un tag poussé sur un commit qui n'a
      # jamais passé (ou plus passé) la CI normale — erreur humaine, tag créé
      # avant la fin de la CI de la PR — ne doit pas aboutir à une
      # publication. Un échec ici bloque tout le reste du job (signature,
      # build, publication de la Release) : comportement par défaut de
      # GitHub Actions, une étape en échec arrête le job.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Vérifie que le build number a bien été incrémenté (pubspec.yaml)
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+)$/\1/')
          echo "Tag courant : $CURRENT_TAG"
          echo "Build number de ce tag : $BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::Impossible de lire le build number depuis pubspec.yaml (format attendu: version: X.Y.Z+N)."
            exit 1
          fi

          # Tag v* le plus élevé (tri sémantique, pas chronologique) parmi
          # tous les tags existants autres que celui qui a déclenché ce run
          # (voir docs/cahier-des-charges/13-depot-versioning-publication.md
          # section 3.2 : un tag v{version} est créé sur le commit publié,
          # jamais sur un commit ultérieur — en supposant que les tags sont
          # créés dans l'ordre des versions, le tri sémantique coïncide avec
          # l'ordre chronologique de publication).
          #
          # On filtre d'abord strictement au format vX.Y.Z (X/Y/Z
          # numériques) avant de trier : un tag v* qui ne respecte pas ce
          # format (typo, tag de test, future convention v*-rc/v*-beta) ne
          # doit jamais pouvoir se classer "plus élevé" que les vrais tags
          # de version par le tri sémantique de Git.
          PREVIOUS_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v -x "$CURRENT_TAG" | sort -V -r | head -n 1)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Aucun tag v* précédent trouvé — premier tag publié, rien à comparer."
            exit 0
          fi

          echo "Tag précédent le plus élevé : $PREVIOUS_TAG"
          PREVIOUS_BUILD_NUMBER=$(git show "${PREVIOUS_TAG}:pubspec.yaml" | grep '^version:' | sed -E 's/.*\+([0-9]+)$/\1/')
          echo "Build number de ce tag précédent : $PREVIOUS_BUILD_NUMBER"

          if [ -z "$PREVIOUS_BUILD_NUMBER" ]; then
            echo "::error::Impossible de lire le build number de $PREVIOUS_TAG (pubspec.yaml de ce tag introuvable ou mal formé) — comparaison impossible, publication bloquée par prudence."
            exit 1
          fi

          if [ "$BUILD_NUMBER" -le "$PREVIOUS_BUILD_NUMBER" ]; then
            echo "::error::Le build number de $CURRENT_TAG ($BUILD_NUMBER) n'est pas strictement supérieur à celui de $PREVIOUS_TAG ($PREVIOUS_BUILD_NUMBER). Les stores refusent une soumission dont le build number n'a pas augmenté — incrémente-le dans pubspec.yaml avant de retagger."
            exit 1
          fi

      - name: flutter build appbundle --flavor prod
        run: flutter build appbundle --flavor prod --dart-define-from-file=config/prod.json -t lib/main.dart

      - name: Publie une Release GitHub avec l'App Bundle signé
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          generate_release_notes: true
          body: |
            App Bundle Android signé (keystore de production), prêt à téléverser manuellement sur la Play Console.
            Publication automatique pas encore configurée — voir docs/GOOGLE_PLAY_PUBLISHING.md.
